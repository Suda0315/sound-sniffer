<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Sniffer · 开始</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f7f7f5;color:#2c2c2a;
  font:14px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.card{max-width:560px;background:#fff;border:1px solid #e5e3dd;border-radius:16px;padding:32px 34px}
h1{font-size:18px;font-weight:500;margin:0 0 6px}
p{color:#5f5e5a;margin:0 0 14px}
ol{padding-left:20px;margin:0 0 18px;color:#5f5e5a}
li{margin-bottom:7px}
a{color:#185fa5;text-decoration:none;font-weight:500}
a:hover{text-decoration:underline}
.box{background:#e6f1fb;border-radius:10px;padding:12px 14px;font-size:13px;color:#0c447c;margin-bottom:18px}
.note{background:#faeeda;border-radius:10px;padding:12px 14px;font-size:13px;color:#854f0b}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f1efe8;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <h1>这个窗口已经被接管</h1>
  <p>它现在是一个受控的 Chrome 实例，所有网络请求都会被监听。你正常上网就行。</p>

  <div class="box">操作面板在另一个标签页：<a href="/" target="_blank">打开控制面板</a></div>

  <ol>
    <li>在这个窗口里打开任何网页，点播放</li>
    <li>回到控制面板，音频流会自己出现在列表里</li>
    <li>点「保存」，文件落到本地下载目录</li>
  </ol>

  <p>用的是独立浏览器配置（登录状态是空的），需要登录的站点请在这里重新登录一次。</p>

  <div class="note">
    只对你自己有权限听到的内容生效。DRM / 加密流抓下来也是密文，工具不做这部分。
  </div>
</div>
</body>
</html>
